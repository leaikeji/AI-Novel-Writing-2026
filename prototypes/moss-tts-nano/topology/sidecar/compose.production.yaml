name: moss-tts-sidecar-t0b

services:
  sidecar:
    image: ai-novel-world/moss-tts-sidecar@sha256:56bb12bdef8f0c8c174ec86aa4dfbeac1dee1dd9cb9a215ff305eca7c8307fe0
    platform: linux/arm64
    command: ["--host", "0.0.0.0", "--port", "8765"]
    environment:
      MOSS_SIDECAR_BACKEND: nano
      MOSS_SIDECAR_TOKEN_FILE: /run/secrets/moss_sidecar_token
      MOSS_MODEL_TREE_SHA256: ${MOSS_MODEL_TREE_SHA256:?required}
      MOSS_SOURCE_TREE_SHA256: ${MOSS_SOURCE_TREE_SHA256:?required}
      MOSS_CPU_THREADS: ${MOSS_CPU_THREADS:-4}
    secrets:
      - moss_sidecar_token
    volumes:
      - type: bind
        source: ${MOSS_MODEL_ROOT:?required}
        target: /models
        read_only: true
      - type: bind
        source: ${MOSS_SOURCE_ROOT:?required}
        target: /source
        read_only: true
    expose: ["8765"]
    networks: [tts_private]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    user: "65532:65532"
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 4g
    cpus: 4.0
    ulimits:
      nofile: {soft: 512, hard: 512}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/live', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 180s

  pawapp-harness:
    image: ai-novel-world/moss-tts-sidecar@sha256:56bb12bdef8f0c8c174ec86aa4dfbeac1dee1dd9cb9a215ff305eca7c8307fe0
    platform: linux/arm64
    entrypoint: ["python", "-c", "import time; time.sleep(86400)"]
    secrets:
      - moss_sidecar_token
    volumes:
      - type: bind
        source: ${MOSS_PAWAPP_MEDIA_ROOT:?required}
        target: /pawapp-media
      - type: bind
        source: ${MOSS_REFERENCE_FIXTURE_ROOT:?required}
        target: /authorized-reference-fixtures
        read_only: true
    networks: [tts_private]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    user: "65532:65532"
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      sidecar: {condition: service_healthy}

networks:
  tts_private:
    internal: true

secrets:
  moss_sidecar_token:
    file: ${MOSS_SIDECAR_TOKEN_FILE:?required}
