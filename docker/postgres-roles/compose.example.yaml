# Integration-only fragment.  It is not loaded by the current compose.yaml.
# The main integration owner must adapt service/network names and verified UIDs.
services:
  database-role-bootstrap:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    user: "0:0"
    entrypoint: ["/opt/ai-novel/postgres-roles/bootstrap.sh"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:?set POSTGRES_DB}"
      PGUSER: "${POSTGRES_ADMIN_ROLE:?set POSTGRES_ADMIN_ROLE}"
      PGPASSFILE: /run/secrets/postgres-role-bootstrap-admin.pgpass
      AI_NOVEL_EXPECTED_DATABASE: "${POSTGRES_DB:?set POSTGRES_DB}"
      AI_NOVEL_EXPECTED_ADMIN_ROLE: "${POSTGRES_ADMIN_ROLE:?set POSTGRES_ADMIN_ROLE}"
      AI_NOVEL_ROLE_BOOTSTRAP_CONFIRM: "${POSTGRES_DB:?set POSTGRES_DB}:${POSTGRES_ADMIN_ROLE:?set POSTGRES_ADMIN_ROLE}"
      AI_NOVEL_RUNTIME_PGHOST: postgres
      AI_NOVEL_RUNTIME_PGPORT: "5432"
      AI_NOVEL_MIGRATOR_UID: "${AI_NOVEL_MIGRATOR_UID:?set verified migrator UID}"
      AI_NOVEL_MIGRATOR_GID: "${AI_NOVEL_MIGRATOR_GID:?set verified migrator GID}"
      AI_NOVEL_API_UID: "${AI_NOVEL_API_UID:?set verified API UID}"
      AI_NOVEL_API_GID: "${AI_NOVEL_API_GID:?set verified API GID}"
      AI_NOVEL_WORKER_UID: "${AI_NOVEL_WORKER_UID:?set verified worker UID}"
      AI_NOVEL_WORKER_GID: "${AI_NOVEL_WORKER_GID:?set verified worker GID}"
    volumes:
      - ./docker/postgres-roles:/opt/ai-novel/postgres-roles:ro
      - ai_novel_migrator_pgpass:/run/ai-novel-db-auth/migrator
      - ai_novel_api_pgpass:/run/ai-novel-db-auth/api
      - ai_novel_worker_pgpass:/run/ai-novel-db-auth/worker
    secrets:
      - source: postgres_role_bootstrap_admin_pgpass
        target: postgres-role-bootstrap-admin.pgpass
        uid: "0"
        gid: "0"
        mode: 0600
    profiles: ["database-role-bootstrap"]

volumes:
  ai_novel_migrator_pgpass: {}
  ai_novel_api_pgpass: {}
  ai_novel_worker_pgpass: {}

secrets:
  postgres_role_bootstrap_admin_pgpass:
    file: "${POSTGRES_ROLE_BOOTSTRAP_ADMIN_PGPASS_FILE:?set an external 0600 admin pgpass path}"
