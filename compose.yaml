name: ai-novel-world-2026

services:
  qwenpaw:
    build:
      context: .
      dockerfile: docker/qwenpaw/Dockerfile
    image: ai-novel-2026-qwenpaw-runtime:2.1.0-mvp0
    container_name: ai-novel-2026-qwenpaw-lab
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      TZ: Asia/Shanghai
      AI_NOVEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_novel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ai_novel_world_2026}
      AI_NOVEL_EMBEDDING_SECRET_ROOT_KEY_FILE: /app/working.secret/ai-novel-world-2026/embedding/root.key
      AI_NOVEL_EMBEDDING_SECRET_RECORDS_DIR: /app/working.secret/ai-novel-world-2026/embedding/records
      AI_NOVEL_TTS_RUNTIME_ENABLED: ${AI_NOVEL_TTS_RUNTIME_ENABLED:-false}
      AI_NOVEL_TTS_PRODUCT_ENABLED: ${AI_NOVEL_TTS_PRODUCT_ENABLED:-false}
      AI_NOVEL_TTS_IDLE_UNLOAD_SECONDS: ${AI_NOVEL_TTS_IDLE_UNLOAD_SECONDS:-300}
      AI_NOVEL_TTS_VALIDATION_ENABLED: ${AI_NOVEL_TTS_VALIDATION_ENABLED:-false}
      AI_NOVEL_TTS_VALIDATION_TOKEN_FILE: /app/working.secret/ai-novel-world-2026/t4k-validation/token
      AI_NOVEL_TTS_VALIDATION_NOVEL_ID: ${AI_NOVEL_TTS_VALIDATION_NOVEL_ID:-}
      AI_NOVEL_TTS_VALIDATION_DOCUMENT_ID: ${AI_NOVEL_TTS_VALIDATION_DOCUMENT_ID:-}
      AI_NOVEL_TTS_VALIDATION_EXPIRES_AT: ${AI_NOVEL_TTS_VALIDATION_EXPIRES_AT:-}
      AI_NOVEL_TTS_REFERENCE_CLONE_ENABLED: ${AI_NOVEL_TTS_REFERENCE_CLONE_ENABLED:-false}
      AI_NOVEL_TTS_DIGEST_KEYRING_FILE: /app/working.secret/ai-novel-world-2026/narration-hmac-keyring.json
      QWEN_TTS_LOCAL_URL: ${QWEN_TTS_LOCAL_URL:-http://host.docker.internal:8766}
      QWEN_TTS_LOCAL_TIMEOUT_SECONDS: ${QWEN_TTS_LOCAL_TIMEOUT_SECONDS:-180}
      QWEN_TTS_LOCAL_TOKEN_FILE: /run/secrets/qwen-tts-local-token
      AI_NOVEL_TTS_MODEL_METADATA_ROOT: /opt/ai-novel-world/narration-model-metadata
      AI_NOVEL_TTS_MEDIA_ROOT: /app/working/ai-novel-world-2026/novel-media
      AI_NOVEL_TTS_FFMPEG_PATH: /opt/ffmpeg/bin/ffmpeg
      AI_NOVEL_TTS_FFPROBE_PATH: /opt/ffmpeg/bin/ffprobe
    ports:
      - "127.0.0.1:18088:8088"
    volumes:
      - qwenpaw-data:/app/working
      - qwenpaw-secrets:/app/working.secret
      - qwenpaw-backups:/app/working.backups
      - novel-media:/app/working/ai-novel-world-2026/novel-media
      - type: bind
        source: ${QWEN_TTS_LOCAL_TOKEN_FILE:-/Users/liujia/Library/Application Support/AI小说世界2026/qwen-tts/local-token}
        target: /run/secrets/qwen-tts-local-token
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/', timeout=5).read(1)"
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: ai-novel-2026-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_novel_world_2026}
      POSTGRES_USER: ${POSTGRES_USER:-ai_novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  qwenpaw-data:
    name: ai-novel-2026-qwenpaw-data
    external: true
  qwenpaw-secrets:
    name: ai-novel-2026-qwenpaw-secrets
    external: true
  qwenpaw-backups:
    name: ai-novel-2026-qwenpaw-backups
    external: true
  postgres-data:
    name: ai-novel-2026-postgres-data
    labels:
      ai.novel.world.project: AI小说世界2026
      ai.novel.world.purpose: postgres-data
  novel-media:
    name: ai-novel-2026-novel-media
    labels:
      ai.novel.world.project: AI小说世界2026
      ai.novel.world.purpose: pawapp-novel-media
      ai.novel.world.write-owner: pawapp-only
