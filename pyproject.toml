[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-world-2026"
version = "0.2.0"
description = "Personal AI novel-writing PawApp for QwenPaw"
requires-python = ">=3.11,<3.14"
dependencies = [
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "pgvector==0.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]
