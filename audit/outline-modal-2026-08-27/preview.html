<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生成大纲弹窗生成态验收</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: #34383f; background: #f6f7f8; font: 14px Inter, "PingFang SC", sans-serif; }
    .shell { display: grid; min-height: 100vh; grid-template-columns: 220px minmax(0, 1fr) 330px; }
    .rail { background: #1d1e20; }
    .workspace { padding: 28px; }
    .workspace-card { height: 100%; border: 1px solid #e8e9ec; border-radius: 14px; background: #fff; }
    .assistant { background: #17181a; }
    .veil { position: fixed; inset: 0; background: rgba(18, 20, 24, .18); }
    .qwenpaw-modal { position: fixed; top: 50%; left: 50%; width: min(680px, calc(100vw - 32px)); max-width: calc(100vw - 32px); transform: translate(-50%, -50%); }
    .qwenpaw-modal-content { overflow: hidden; border: 1px solid #ebe6e2; border-radius: 22px; background: #fff; box-shadow: 0 28px 80px rgba(30,24,20,.24), 0 8px 24px rgba(30,24,20,.1); }
    .qwenpaw-modal-header { min-height: 70px; border-bottom: 1px solid #f0ebe7; padding: 18px 58px 16px 24px; background: linear-gradient(180deg,#fffaf7 0%,#fff 100%); }
    .qwenpaw-modal-body { max-height: min(760px, calc(100dvh - 104px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: 18px 24px 24px; }
    .qwenpaw-modal-close { position: absolute; z-index: 4; top: 16px; right: 16px; display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 10px; color: #8a909d; background: transparent; font-size: 20px; }
    .mb-outline-modal-title { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .mb-outline-modal-title-icon { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border: 1px solid #ffd9c9; border-radius: 11px; color: #f06d42; background: #fff0e9; font-size: 18px; }
    .mb-outline-modal-title-copy { display: grid; min-width: 0; gap: 2px; }
    .mb-outline-modal-title-copy strong { color: #202329; font-size: 19px; line-height: 1.25; }
    .mb-outline-modal-title-copy small { overflow: hidden; color: #999da4; font-size: 11px; font-weight: 500; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .mb-outline-wizard { display: grid; min-height: 0; gap: 16px; }
    .mb-outline-progress-hint { width: max-content; max-width: 100%; justify-self: center; border: 1px solid #ffd8c9; border-radius: 999px; padding: 5px 12px; color: #dc623b; background: #fff4ee; font-size: 11px; font-weight: 700; line-height: 1.35; text-align: center; }
    .mb-outline-steps { position: relative; display: flex; width: 100%; justify-content: space-between; margin-bottom: 2px; padding: 0 8px; }
    .mb-outline-steps::before { position: absolute; z-index: 0; top: 15px; right: 23px; left: 23px; height: 3px; background: #e6e7e9; content: ""; }
    .mb-outline-step { position: relative; z-index: 1; display: grid; width: 30px; flex: 0 0 30px; justify-items: center; gap: 8px; color: #999da4; font-size: 12px; }
    .mb-outline-step-dot { display: grid; width: 30px; height: 30px; place-items: center; border: 2px solid #e1e3e6; border-radius: 50%; color: #8d9198; background: #fff; font-weight: 750; }
    .mb-outline-step.is-active { color: #f06d42; font-weight: 700; }
    .mb-outline-step.is-active .mb-outline-step-dot { border-color: #ff7548; color: #fff; background: #ff7548; box-shadow: 0 4px 12px rgba(255,117,72,.24); }
    .mb-outline-step-body { display: grid; min-height: 260px; align-content: start; gap: 12px; border: 1px solid #eceef1; border-radius: 16px; padding: 24px; background: linear-gradient(180deg,#fcfcfd 0%,#fafafa 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
    .mb-outline-step-body.is-count { place-items: center; align-content: center; padding: 28px 24px; }
    .mb-outline-step-body h3 { margin: 0; color: #24272d; font-size: 21px; line-height: 1.3; }
    .mb-outline-step-body p { max-width: 520px; margin: 0 auto 8px; color: #858a92; font-size: 13px; line-height: 1.7; text-align: center; }
    .count-input { display: grid; width: 220px; height: 58px; place-items: center; margin-top: 8px; border: 1px solid #dfe2e6; border-radius: 12px; color: #202329; background: #fff; box-shadow: 0 8px 22px rgba(34,40,50,.08); font-size: 22px; font-weight: 750; }
    .mb-manual-link { width: max-content; max-width: 100%; margin: -2px auto 0; border: 0; border-radius: 8px; padding: 7px 10px; color: #df6841; background: transparent; font-weight: 650; }
    .mb-outline-footer { position: sticky; z-index: 3; bottom: -24px; display: flex; gap: 12px; margin: 0 -24px -24px; padding: 14px 24px 24px; background: linear-gradient(180deg,rgba(255,255,255,.72) 0%,#fff 24%,#fff 100%); }
    .primary { min-height: 50px; flex: 1; border: 0; border-radius: 11px; color: #fff; background: linear-gradient(100deg,#ff6938 0%,#ff865e 100%); box-shadow: 0 10px 22px rgba(255,105,56,.24); font-size: 15px; font-weight: 700; }
    .mb-outline-generation-panel { display: grid; min-height: 260px; place-content: center; justify-items: center; gap: 20px; border: 1px solid #f0e7e2; border-radius: 16px; padding: 34px 24px; background: radial-gradient(circle at 50% 44%,rgba(255,112,67,.08),transparent 145px),linear-gradient(180deg,#fffdfc 0%,#fbfaf9 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.9); }
    .qwenpaw-spin-dot { width: 32px; height: 32px; border: 4px solid #ffd9cc; border-top-color: #ff7043; border-radius: 50%; animation: spin .8s linear infinite; }
    .mb-outline-generation-status { display: grid; min-width: 300px; max-width: min(460px,calc(100vw - 96px)); justify-items: center; gap: 6px; padding: 10px 18px; color: #34383f; }
    .mb-outline-generation-status strong { color: #d95830; font-size: 16px; font-weight: 760; line-height: 1.45; }
    .mb-outline-generation-status > span { color: #5f646c; font-size: 12px; font-weight: 550; line-height: 1.55; }
    .mb-outline-generation-status small { color: #989ca3; font-size: 11px; font-weight: 500; line-height: 1.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-height: 760px) {
      .qwenpaw-modal-body { max-height: calc(100dvh - 80px); padding-top: 14px; }
      .mb-outline-wizard { gap: 12px; }
      .mb-outline-step-body.is-count { min-height: 224px; padding: 20px 22px; }
      .mb-outline-footer { padding-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="shell"><aside class="rail"></aside><main class="workspace"><div class="workspace-card"></div></main><aside class="assistant"></aside></div>
  <div class="veil"></div>
  <section class="qwenpaw-modal mb-outline-modal" role="dialog" aria-label="生成大纲">
    <div class="qwenpaw-modal-content">
      <button class="qwenpaw-modal-close" aria-label="关闭">×</button>
      <header class="qwenpaw-modal-header">
        <div class="mb-outline-modal-title"><span class="mb-outline-modal-title-icon">▤</span><span class="mb-outline-modal-title-copy"><strong>生成大纲</strong><small>AI 辅助生成，可逐步检查和修改</small></span></div>
      </header>
      <div class="qwenpaw-modal-body">
        <div class="mb-outline-generation-panel" role="status" aria-live="polite">
          <span class="qwenpaw-spin-dot" aria-hidden="true"></span>
          <span class="mb-outline-generation-status"><strong>正在生成故事背景</strong><span>AI 正在整理世界观与时代背景，请稍候</span><small>请保持当前页面打开，完成后会自动进入下一步</small></span>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
