<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人物声音页设计对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #eef0f3; color: #20242a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { min-width: 0; margin: 0; border: 1px solid #d9dde3; border-radius: 14px; padding: 12px; background: #fff; }
    figcaption { margin-bottom: 10px; font-size: 15px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border-radius: 9px; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>设计目标</figcaption>
      <img src="01-target.png" alt="人物声音页设计目标">
    </figure>
    <figure>
      <figcaption>真实实现 · 1696×1236</figcaption>
      <img src="02-desktop-1696x1236.png" alt="人物声音页真实实现">
    </figure>
  </main>
</body>
</html>
